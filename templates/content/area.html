{% extends 'base.html' %}

{% block content %}
<style>
    /* Main Container with Gold/Amber Theme */
    .conv-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(243, 156, 18, 0.3);
        border-radius: 20px;
        padding: 40px 30px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(243, 156, 18, 0.1);
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    /* Title Styling */
    .conv-title {
        color: #f39c12;
        font-family: 'Wallpoet', cursive;
        letter-spacing: 2px;
        font-size: 1.6rem;
        margin: 0;
        text-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
    }

    /* Common Label Styling */
    .section-label {
        color: #a4b0be;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-align: left;
        margin-bottom: 8px;
        display: block;
    }

    /* Step 1: Input Box */
    .input-box {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1.5rem;
        font-family: 'Poppins', sans-serif;
        padding: 15px 20px;
        border-radius: 12px;
        width: 100%;
        outline: none;
        transition: all 0.3s;
        text-align: center;
    }

    .input-box:focus {
        border-color: #f39c12;
        box-shadow: 0 0 15px rgba(243, 156, 18, 0.3);
    }

    /* Step 2: Conversion Selection Row */
    .conversion-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
    }

    .unit-select-box {
        flex: 1;
        text-align: left;
    }

    .conv-select {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 1.1rem;
        padding: 12px;
        border-radius: 10px;
        width: 100%;
        outline: none;
        cursor: pointer;
        transition: 0.3s;
    }

    .conv-select:focus { border-color: #f39c12; }
    .conv-select option { background: #0a1423; color: white; }

    /* Directional Arrow */
    .arrow-icon {
        color: #f39c12;
        font-size: 1.5rem;
        margin-top: 25px;
        opacity: 0.7;
    }

    /* Step 3: Output Display Area */
    .output-section {
        background: rgba(243, 156, 18, 0.1);
        border: 2px dashed rgba(243, 156, 18, 0.5);
        padding: 20px;
        border-radius: 12px;
        min-height: 100px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .result-value {
        color: #f39c12;
        font-size: 2.5rem;
        font-weight: 800;
        word-break: break-all;
        text-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
    }

    .result-unit {
        color: white;
        font-size: 1rem;
        opacity: 0.8;
        margin-top: 5px;
    }

    /* Step 4: Process Action Button */
    .process-btn {
        background: linear-gradient(145deg, rgba(243, 156, 18, 0.1), rgba(0, 0, 0, 0.3));
        border: 1px solid #f39c12;
        color: #f39c12;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 2px;
        padding: 18px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        width: 100%;
    }

    .process-btn:hover {
        background: rgba(243, 156, 18, 0.2);
        color: #ffffff;
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(243, 156, 18, 0.4), inset 0 0 10px rgba(243, 156, 18, 0.2);
    }

    .process-btn:active {
        transform: translateY(1px);
    }

    /* Responsive Adjustments for Mobile Devices */
    @media (max-width: 450px) {
        .conversion-row { flex-direction: column; gap: 10px; }
        .arrow-icon { transform: rotate(90deg); margin-top: 0; margin-bottom: 0; }
    }
</style>

<div class="conv-container">
    <h2 class="conv-title">AREA CONVERTER</h2>
    
    <div>
        <label class="section-label">1. ENTER AREA VALUE</label>
        <input type="number" id="areaValue" class="input-box" placeholder="e.g. 100">
    </div>

    <div class="conversion-row">
        <div class="unit-select-box">
            <label class="section-label">FROM UNIT</label>
            <select id="areaFrom" class="conv-select">
                <option value="sq_m" selected>Square Meter (m²)</option>
                <option value="sq_km">Square Kilometer (km²)</option>
                <option value="sq_ft">Square Foot (ft²)</option>
                <option value="sq_yd">Square Yard (yd²)</option>
                <option value="acre">Acre (ac)</option>
                <option value="hectare">Hectare (ha)</option>
                <option value="bigha">Bigha (UP Std)</option>
                <option value="biswa">Biswa (UP Std)</option>
            </select>
        </div>
        
        <div class="arrow-icon"><i class="fas fa-arrow-right"></i></div>
        
        <div class="unit-select-box">
            <label class="section-label">TO UNIT</label>
            <select id="areaTo" class="conv-select">
                <option value="sq_m">Square Meter (m²)</option>
                <option value="sq_km">Square Kilometer (km²)</option>
                <option value="sq_ft" selected>Square Foot (ft²)</option>
                <option value="sq_yd">Square Yard (yd²)</option>
                <option value="acre">Acre (ac)</option>
                <option value="hectare">Hectare (ha)</option>
                <option value="bigha">Bigha (UP Std)</option>
                <option value="biswa">Biswa (UP Std)</option>
            </select>
        </div>
    </div>

    <div class="output-section">
        <label class="section-label" style="text-align: center; color: #f39c12;">FINAL RESULT</label>
        <div class="result-value" id="areaResult">--</div>
        <div class="result-unit" id="areaUnitLabel">Ready to calculate</div>
    </div>

    <button class="process-btn" onclick="processArea()">
        PROCESS <i class="fas fa-bolt"></i>
    </button>
</div>

<script>
    // Asynchronous function to communicate with Django backend
    async function processArea() {
        const valInput = document.getElementById('areaValue').value;
        const fromUnit = document.getElementById('areaFrom').value;
        const toUnit = document.getElementById('areaTo').value;
        const toLabel = document.getElementById('areaTo').options[document.getElementById('areaTo').selectedIndex].text;

        const resultBox = document.getElementById('areaResult');
        const unitLabelBox = document.getElementById('areaUnitLabel');

        // Validate input data
        if (valInput === '' || isNaN(valInput)) {
            resultBox.innerText = "Error";
            resultBox.style.color = "#ff4757"; 
            unitLabelBox.innerText = "Please enter a valid number";
            return;
        }

        // Show processing state while waiting for server response
        resultBox.innerText = "Processing...";
        resultBox.style.color = "#f39c12"; 
        unitLabelBox.innerText = "Fetching from Server...";

        try {
            // Send POST request to Django backend
            const response = await fetch('/calculate-area/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    value: valInput,
                    from_unit: fromUnit,
                    to_unit: toUnit
                })
            });

            const data = await response.json();

            // Handle successful calculation
            if (data.result !== undefined) {
                resultBox.innerText = data.result;
                unitLabelBox.innerText = toLabel;
            } else {
                // Handle backend errors
                resultBox.innerText = "Error";
                resultBox.style.color = "#ff4757";
                unitLabelBox.innerText = data.error;
            }
        } catch (error) {
            // Handle network or server downtime
            resultBox.innerText = "Server Down";
            resultBox.style.color = "#ff4757";
            unitLabelBox.innerText = "Could not connect to backend";
            console.error("Backend communication failed:", error);
        }
    }
</script>
{% endblock %}
