{% extends 'base.html' %}

{% block content %}
<style>
    /* =========================================
       1. DESKTOP / DEFAULT LAYOUT
       ========================================= */
    .page-wrapper {
        display: flex;
        width: 100%;
        max-width: 950px;
        gap: 40px;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }

    /* Converter Container (Glassmorphism) */
    .conv-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(245, 158, 11, 0.3); /* Amber theme for Area */
        border-radius: 20px;
        padding: 30px;
        width: 400px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(245, 158, 11, 0.1);
        text-align: center;
        flex-shrink: 0;
    }

    .conv-title { 
        color: #f59e0b; 
        font-family: 'Wallpoet', cursive; 
        margin-bottom: 20px; 
        font-size: 1.6rem; 
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); 
        text-transform: uppercase;
    }

    .section-label { 
        color: #a4b0be; 
        font-size: 0.85rem; 
        font-weight: 600; 
        letter-spacing: 1px; 
        margin-bottom: 8px; 
        display: block; 
        text-align: left;
    }

    .input-box, .conv-select {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        font-family: 'Poppins', sans-serif;
        font-size: 1.1rem;
        padding: 12px 15px;
        border-radius: 12px;
        width: 100%;
        outline: none;
        transition: 0.3s;
        box-shadow: inset 0 3px 10px rgba(0,0,0,0.5);
    }
    
    .input-box:focus, .conv-select:focus {
        border-color: #f59e0b;
        box-shadow: inset 0 3px 10px rgba(0,0,0,0.5), 0 0 8px rgba(245, 158, 11, 0.3);
    }

    .conv-select option { 
        background: #0a1423; 
        color: white; 
    }

    /* Result Output Area */
    .result-box {
        background: rgba(245, 158, 11, 0.05); 
        border: 1px dashed rgba(245, 158, 11, 0.4); 
        padding: 20px; 
        border-radius: 12px; 
        text-align: center; 
        margin: 20px 0;
    }

    .result-value {
        color: #f59e0b; 
        font-size: 2.2rem; 
        font-weight: 800;
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .result-unit {
        color: #cbd5e1; 
        font-size: 0.9rem;
    }

    .btn-submit { 
        width: 100%;
        padding: 15px; 
        background: #f59e0b; 
        color: #000; 
        border: none; 
        border-radius: 12px; 
        font-weight: 800; 
        font-size: 1.1rem;
        cursor: pointer; 
        transition: all 0.3s;
        box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
    }

    .btn-submit:hover { 
        background: #d97706; 
        color: #fff; 
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
    }

    /* Attractive Right Side Visual */
    .attractive-visual {
        flex: 1;
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), rgba(0,0,0,0.4));
        border: 1px solid rgba(245, 158, 11, 0.2);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }
    
    .attractive-visual h3 { 
        color: #f59e0b; 
        font-size: 1.8rem; 
        font-family: 'Wallpoet', cursive; 
        margin-bottom: 15px; 
        position: relative;
        z-index: 2;
    }
    
    .attractive-visual p { 
        color: #a4b0be; 
        font-size: 1.05rem; 
        line-height: 1.7; 
        margin-bottom: 25px; 
        position: relative;
        z-index: 2;
    }

    .visual-icon { 
        font-size: 4.5rem; 
        color: rgba(245, 158, 11, 0.2); 
        text-align: right; 
        position: relative;
        z-index: 2;
    }

    .visual-glow {
        position: absolute;
        top: -50px;
        right: -50px;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.2) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 1;
    }

    /* =========================================
       2. RESPONSIVE / MOBILE LAYOUT
       ========================================= */
    @media (max-width: 850px) {
        .page-wrapper { gap: 20px; }
        .attractive-visual { padding: 20px; }
        .attractive-visual h3 { font-size: 1.5rem; }
    }

    @media (max-width: 768px) {
        .page-wrapper {
            flex-direction: column; 
            width: 100%;
        }

        /* Hide the visual card on mobile */
        .attractive-visual { display: none !important; }

        /* Make converter full width */
        .conv-container {
            width: 100%;
            max-width: 450px;
            padding: 20px; 
            margin: 0 auto;
        }
    }
</style>

<div class="page-wrapper">
    <div class="conv-container">
        <h2 class="conv-title">LAND AREA SYSTEM</h2>
        
        <div style="margin-bottom: 20px;">
            <label class="section-label">SURFACE VALUE</label>
            <input type="number" step="any" id="areaValue" class="input-box" placeholder="e.g. 500" style="text-align: center; font-size: 1.5rem;">
        </div>

        <div style="display: flex; gap: 15px; margin-bottom: 10px;">
            <div style="flex: 1;">
                <label class="section-label">FROM UNIT</label>
                <select id="areaFrom" class="conv-select">
                    <option value="sq_m">Square Meter (m²)</option>
                    <option value="sq_km">Square Kilometer (km²)</option>
                    <option value="sq_ft" selected>Square Foot (sq ft)</option>
                    <option value="sq_yd">Square Yard (sq yd)</option>
                    <option value="acre">Acre (ac)</option>
                    <option value="hectare">Hectare (ha)</option>
                    <option value="bigha">Bigha (UP Std)</option>
                    <option value="biswa">Biswa (UP Std)</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label class="section-label">TO UNIT</label>
                <select id="areaTo" class="conv-select">
                    <option value="sq_m">Square Meter (m²)</option>
                    <option value="sq_km">Square Kilometer (km²)</option>
                    <option value="sq_ft">Square Foot (sq ft)</option>
                    <option value="sq_yd">Square Yard (sq yd)</option>
                    <option value="acre">Acre (ac)</option>
                    <option value="hectare">Hectare (ha)</option>
                    <option value="bigha" selected>Bigha (UP Std)</option>
                    <option value="biswa">Biswa (UP Std)</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <div id="areaResult" class="result-value">--</div>
            <div id="areaUnitLabel" class="result-unit">Target Unit</div>
        </div>

        <button onclick="processArea()" class="btn-submit">CALCULATE AREA</button>
    </div>

    <div class="attractive-visual">
        <div class="visual-glow"></div>
        <h3>Real Estate Mapping</h3>
        <p>Convert structural dimensions seamlessly, bridging international standard matrices with localized UP regional land units like Bigha and Biswa.</p>
        <div class="visual-icon"><i class="fas fa-vector-square"></i></div>
    </div>
</div>

<script>
    async function processArea() {
        const val = document.getElementById('areaValue').value;
        const from = document.getElementById('areaFrom').value;
        const to = document.getElementById('areaTo').value;
        
        // Extract visible text for the result label
        const toSelect = document.getElementById('areaTo');
        const toLabel = toSelect.options[toSelect.selectedIndex].text;
        
        if(!val) {
            document.getElementById('areaResult').innerText = "0";
            return;
        }
        
        try {
            // Post payload to backend logic
            const res = await fetch('/calculate-area/', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ value: val, from_unit: from, to_unit: to })
            });
            
            const data = await res.json();
            
            if (data.result !== undefined) {
                document.getElementById('areaResult').innerText = data.result;
                document.getElementById('areaUnitLabel').innerText = toLabel;
            } else {
                document.getElementById('areaResult').innerText = 'Error';
            }
        } catch (e) { 
            console.error("Conversion failed", e);
            document.getElementById('areaResult').innerText = 'Error'; 
        }
    }
</script>
{% endblock %}
