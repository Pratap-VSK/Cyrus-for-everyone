{% extends 'base.html' %}

{% block content %}
<style>
    /* =========================================
       1. DESKTOP / DEFAULT LAYOUT
       ========================================= */
    .page-wrapper {
        display: flex;
        width: 100%;
        max-width: 950px;
        gap: 40px;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
    }

    /* Original Calculator Container (Glassmorphism) */
    .conv-container {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 71, 87, 0.3); /* Matches your theme */
        border-radius: 20px;
        padding: 30px;
        width: 400px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 71, 87, 0.1);
        text-align: center;
        flex-shrink: 0;
    }

    .calc-title { 
        color: #ff4757; 
        font-family: 'Wallpoet', cursive; 
        margin-bottom: 20px; 
        font-size: 1.6rem; 
        text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); 
        text-transform: uppercase;
    }

    .calc-display { 
        width: 100%; 
        height: 75px; 
        background: rgba(0, 0, 0, 0.4); 
        border: none; 
        border-bottom: 2px solid #2ed573; 
        border-radius: 12px 12px 0 0; 
        color: white; 
        font-size: 2.2rem; 
        font-family: 'Poppins', sans-serif;
        text-align: right; 
        padding: 10px 20px; 
        margin-bottom: 25px; 
        outline: none; 
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.6); 
    }

    .calc-buttons { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); 
        gap: 15px; 
    }

    .calc-btn { 
        background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2)); 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        color: white; 
        font-size: 1.3rem; 
        font-family: 'Poppins', sans-serif;
        font-weight: 600; 
        padding: 15px 0; 
        border-radius: 12px; 
        cursor: pointer; 
        transition: all 0.2s; 
        box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3); 
    }

    .calc-btn:hover { 
        background: rgba(255, 255, 255, 0.15); 
        transform: translateY(-2px); 
        box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
    }

    .calc-btn:active {
        transform: translateY(1px);
    }

    .btn-operator { color: #ffa502; background: rgba(255, 165, 2, 0.1); border-color: rgba(255, 165, 2, 0.3); }
    .btn-clear { color: #ff4757; background: rgba(255, 71, 87, 0.1); border-color: rgba(255, 71, 87, 0.3); }
    .btn-submit { color: #000; background: #2ed573; border-color: #2ed573; grid-column: span 2; font-weight: 800; }
    .btn-submit:hover { background: #27ae60; color: #fff; }

    /* Attractive Right Side Visual */
    .attractive-visual {
        flex: 1;
        background: linear-gradient(135deg, rgba(255, 165, 2, 0.05), rgba(0,0,0,0.4));
        border: 1px solid rgba(255, 165, 2, 0.2);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }
    
    .attractive-visual h3 { 
        color: #ffa502; 
        font-size: 1.8rem; 
        font-family: 'Wallpoet', cursive; 
        margin-bottom: 15px; 
        position: relative;
        z-index: 2;
    }
    
    .attractive-visual p { 
        color: #a4b0be; 
        font-size: 1.05rem; 
        line-height: 1.7; 
        margin-bottom: 25px; 
        position: relative;
        z-index: 2;
    }

    .visual-icon { 
        font-size: 4.5rem; 
        color: rgba(255, 165, 2, 0.2); 
        text-align: right; 
        position: relative;
        z-index: 2;
    }

    .visual-glow {
        position: absolute;
        top: -50px;
        right: -50px;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(255, 165, 2, 0.2) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 1;
    }

    /* =========================================
       2. RESPONSIVE / MOBILE LAYOUT
       ========================================= */
    @media (max-width: 850px) {
        /* Tablet adjustments */
        .page-wrapper {
            gap: 20px;
        }
        .attractive-visual {
            padding: 20px;
        }
        .attractive-visual h3 {
            font-size: 1.5rem;
        }
    }

    @media (max-width: 768px) {
        /* Mobile specific adjustments */
        .page-wrapper {
            flex-direction: column; 
            width: 100%;
        }

        /* Hide the visual card on small screens to save space */
        .attractive-visual {
            display: none !important; 
        }

        /* Make calculator full width */
        .conv-container {
            width: 100%;
            max-width: 450px;
            padding: 20px; 
            margin: 0 auto;
        }
        
        .calc-btn {
            font-size: 1.2rem;
            padding: 12px 0;
        }

        .calc-display {
            font-size: 1.8rem;
            height: 65px;
        }
    }
</style>

<div class="page-wrapper">
    <div class="conv-container">
        <h2 class="calc-title">SMART CALCULATOR</h2>
        
        <input type="text" id="calc-screen" class="calc-display" placeholder="0" readonly>
        
        <div class="calc-buttons">
            <button class="calc-btn btn-clear" onclick="clearScreen()">C</button>
            <button class="calc-btn btn-operator" onclick="appendValue('(')">(</button>
            <button class="calc-btn btn-operator" onclick="appendValue(')')">)</button>
            <button class="calc-btn btn-operator" onclick="appendValue('/')">÷</button>
            
            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn btn-operator" onclick="appendValue('*')">×</button>
            
            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn btn-operator" onclick="appendValue('-')">-</button>
            
            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn btn-operator" onclick="appendValue('+')">+</button>
            
            <button class="calc-btn" onclick="appendValue('0')">0</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>
            <button class="calc-btn btn-submit" onclick="calculateResult()">= PROCESS</button>
        </div>
    </div>

    <div class="attractive-visual">
        <div class="visual-glow"></div>
        <h3>Server-Side Matrix</h3>
        <p>Unlike standard static calculators, your mathematical expressions are securely parsed and evaluated through our advanced backend engine, ensuring zero latency and high precision across all devices.</p>
        <div class="visual-icon"><i class="fas fa-microchip"></i></div>
    </div>
</div>

<script>
    const screen = document.getElementById('calc-screen');

    // Function to handle operator constraints securely
    function appendValue(val) { 
        if (screen.value === 'Error' || screen.value === '0') screen.value = ''; 
        
        const operators = ['+', '-', '*', '/'];
        const lastChar = screen.value.slice(-1);

        // Operator restriction logic to prevent multiple operators (e.g. ++, /*)
        if (operators.includes(val)) {
            // Prevent initial operators except minus (e.g. *9 is invalid, -9 is valid)
            if (screen.value === '' && val !== '-') return;
            
            // If the last character is already an operator, replace it with the new one
            if (operators.includes(lastChar)) {
                screen.value = screen.value.slice(0, -1) + val;
                return;
            }
        }
        
        // Prevent multiple sequential decimals
        if (val === '.' && lastChar === '.') return;

        screen.value += val; 
    }

    // Wipes screen clean
    function clearScreen() { 
        screen.value = ''; 
    }
    
    // Send string to backend API
    async function calculateResult() {
        if (!screen.value) return;
        
        try {
            const res = await fetch('/calculate/', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expression: screen.value })
            });
            const data = await res.json();
            
            if (data.result !== undefined) {
                screen.value = data.result;
            } else {
                screen.value = 'Error';
            }
        } catch (e) { 
            console.error("Backend computation failed", e);
            screen.value = 'Error'; 
        }
    }
</script>
{% endblock %}
